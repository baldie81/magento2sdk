name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          coverage: none
          tools: composer:v2
        env:
          # Authenticated package downloads: anonymous ones from GitHub get
          # rate limited (HTTP 429) every so often and fail the build.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate composer.json
        run: composer validate --strict

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        # Retried: a download that fails on a busy mirror usually works a moment later.
        run: |
          for attempt in 1 2 3; do
            composer install --prefer-dist --no-interaction --no-progress && exit 0
            echo "composer install failed (attempt $attempt); retrying in 20s"
            sleep 20
          done
          exit 1

      - name: Audit runtime dependencies
        run: composer audit --no-dev

      - name: Static analysis
        run: composer analyse

      - name: Run tests
        run: composer test
